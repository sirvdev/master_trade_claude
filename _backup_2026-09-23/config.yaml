strategy:
  # DEAD 2026-08-30 audit: classic-engine setup list. nlm_engine.py never reads it.
  # # Entry types — evaluated in order, first passing type wins.
  # # Each type has its own order placement logic (market vs limit).
  # entry_types:
  #   - breakout_retest        # Market order — retest already confirmed at bar close
  #   - ema_stack_pullback     # Limit order  — enter at EMA20 level
  #   - pullback_to_sr         # Limit order  — enter at S/R zone
  #   - bb_squeeze_breakout    # Market order — volatility expansion
  #   - macd_zero_cross        # Market order — momentum shift confirmed
  #   - momentum_breakout      # Market order — always immediate
  #   - rsi_divergence         # Limit order  — reversal at structure
  #   # - crossover_entry         # Limit order  — e.g. EMA20 crossing EMA50
  #   # - candle_pattern_entry    # Limit order  — e.g. bullish engulfing at support
  #   # - price_action_entry       # Limit order  — e.g. HHHL structure break retest
  #   # - bandbreak_entry           # Limit order  — price breaking above upper BB or below lower BB
  #   # - vwap_reversion_entry       # Limit order  — price rejecting from VWAP after touching it
  #   # - obv_divergence_entry       # Limit order  — OBV divergence at structure
 
  # Score threshold for volatile symbols (XAUUSD, BTC, NAS100).
  # Override per-symbol with confluence_threshold in the symbol block.
  confluence_required: 7
 
  # Score threshold for calmer instruments (EURUSD, GBPUSD, XAGUSD).
  confluence_threshold_calm: 5
 
  # DEAD 2026-08-30 audit: classic-engine params. Not read by nlm_engine.py.
  # # Breakout retest specific params
  # breakout_retest:
  #   lookback_bars: 5                  # How many prior bars to scan for the broken level
  #   max_distance_atr: 0.5             # Max distance from level in ATR multiples
  #   require_rejection: true           # Close must be back above (long) / below (short) level
 
  # Session-aware ATR multiplier for stop sizing.
  # Prevents Asian-range stops from being blown in London/NY.
  session_atr_multipliers:
    asian:   2.0    # UTC 00:00–07:00  — quiet, tight range
    london:  2.5    # UTC 07:00–12:00  — high volatility
    ny:      2.5    # UTC 12:00–20:00  — high volatility
    overlap: 2.0    # UTC 20:00–24:00  — winding down
 
  # Limit order expiry — how many primary_timeframe bars after the
  # NEXT bar close before the order is considered stale and cancelled.
  # The 60-second minimum floor prevents any cancellation within 1 min of placement.
  limit_order_expiry:
    ema_stack_pullback_bars:           2   # EMA moves, stale quickly
    pullback_to_sr_bars:               5   # S/R is sticky
    rsi_divergence_bars:               3   # Divergence window is medium
    bb_squeeze_breakout_bars:          1   # Must break out immediately
    nlm_order_block_bars:              3   # NLM OB entry — zone is sticky
    nlm_fvg_bars:                      2   # NLM FVG — fills or fails fast
    nlm_breaker_bars:                  2   # NLM breaker — lower conviction
    price_invalidation_atr_multiplier: 1.0 # Cancel if price moves 1×ATR past entry level
    min_cancel_floor_seconds:         60   # Never cancel within 60s of placement
 
  # Existing filters — unchanged
  filters:
    respect_higher_tf_bias: true
    allow_override: false
    min_atr_threshold: 0.0005
    max_atr_threshold: 0.05
    session_blockouts:
      - name: london_market_orders
        enabled: true
        start: '07:00'
        end: '12:00'
        order_types: ['market']
      - name: overlap_all_orders
        enabled: true
        start: '20:00'
        end: '24:00'
        order_types: ['market', 'limit']
    news_blackout:
      enabled: false
      windows:
        - start: '13:30'
          end: '14:30'
          days: [1, 2, 3, 4, 5]
        - start: '07:30'
          end: '08:30'
          days: [1, 2, 3]
risk_management:
  # Contract sizes, MEASURED not assumed. Derived from 441 real broker fills as
  # profit / (lots x price_move) across all four instances, Jul 30 - Aug 29:
  #   XAUUSDm 100.0000 (n=196)   XAGUSDm 5000.0000 (n=53)
  #   EURUSDm 100000.0000 (n=60) BTCUSDm 1.0000 (n=47)
  #   ETHUSDm 1.0000 (n=82)      US30m 1.0053 (n=1)  US500m 1.0022 (n=2)
  # CORRECTED 2026-08-30: these are AUTHORITATIVE for this instance, not a
  # fallback. get_symbol_info exists in the signal bridge (v2.505) but not in
  # PythonFileBridge v2.700, which is the EA the four strategy instances run,
  # so nothing can ask the broker at runtime here. main.py probes once, is told
  # "Unknown action", and stops asking. Keep this table in step with MT5 by hand
  # (right-click symbol -> Specification -> "Contract size"). If the strategy EA
  # is ever given get_symbol_info, the live values take over automatically and
  # this becomes the fallback it was meant to be.
  mt5_contract_sizes:
    XAUUSDm: 100
    XAGUSDm: 5000
    EURUSDm: 100000
    BTCUSDm: 1
    ETHUSDm: 1
    US30m: 1
    US500m: 1

  # Per-symbol lot ceilings. A single max_position_size_lots cannot be right
  # across instruments whose notional per lot differs by five orders of
  # magnitude: at 6.0 lots the same cap meant $14.6k of ETH and $2.76m of gold,
  # so it never touched gold and clipped 100% of ETH trades down to 15-19% of
  # their intended risk. Symbols absent here keep the global cap unchanged.
  max_position_size_lots_per_symbol:
    # NLM only: intended lots at $600 risk run 3-48 (US30m) and 25-526
    # (US500m) depending on stop distance. Set near the 90th percentile
    # so a normal signal gets its full risk and a pathologically tight
    # stop is still capped. Every cap that bites is logged with the
    # dollar shortfall.
    US30m: 35
    US500m: 120

  # Symbol-agnostic notional backstop, in multiples of equity, per position.
  # Fixed-fractional sizing puts no ceiling on exposure: a US500m signal with a
  # 1.14-point stop wants 525 lots (40x equity) at the same $600 of risk. The
  # 30x default cannot change any historical trade -- the widest position any
  # instance actually took was 26.0x (XAUUSDm) -- so it is a backstop, not a
  # policy. Tighten it once you have decided what maximum exposure you want.
  max_notional_exposure_equity_multiple: 30.0

  # Weekend flattening for instruments that close for the weekend.
  # ADDED 2026-08-30 audit: the pre-close sweep only cancelled pending orders,
  # so open positions rode through the weekend. XAUUSDm 0.71 lots opened an hour
  # before the Friday 21:00 close stopped out on the Sunday gap for -599.45, and
  # EURUSDm 4.85 lots for -596.55. Which instruments this applies to is decided
  # from the broker's session table, not a symbol list, so crypto is left alone
  # automatically. min_gap_hours is what separates the weekend from the ~1 hour
  # daily break; do not lower it below about 4.
  weekend_close:
    enabled: true
    minutes_before_close: 30
    min_gap_hours: 8
  max_risk_percent_per_trade: 0.6   # tripled 2026-07-27 (was 0.2)
  max_position_size_lots: 6.0       # tripled 2026-07-27 (was 2.0)
  use_dynamic_sizing: true
  stop_loss:
    method: conservative
    atr_multiplier: 1.5
    structure_buffer_pips: 2
  # G4 2026-08-30 audit: close_percent and dynamic_extension are NOT used.
  # main.py transmits only take_profit_2 to the broker and the EA builds its
  # own ladder to it, so only rr_ratio has any effect. Left in place because
  # dashboard/app.py edits this block; do not tune close_percent expecting a
  # result.
  take_profit:
    targets:
    - name: TP1
      rr_ratio: 2
      close_percent: 50
    - name: TP2
      rr_ratio: 4
      close_percent: 30
    dynamic_extension: true
  global_limits:
    daily_max_drawdown_percent: 5.0
    max_concurrent_trades: 10
    max_trades_per_day: 333
    max_risk_per_symbol_percent: 3.0
    cooldown_after_losses:
      enabled: true
      consecutive_losses: 5
      cooldown_seconds: 3600
    emergency_shutdown:
      enabled: true
      trigger_drawdown_percent: 4.7
      close_positions_on_shutdown: false # true = close all positions on any shutdown event, false = only shutdown trading activity, keep existing positions open and reconcile on restart
nlm:
  confluence_required: 12        # threshold for XAUUSD
  confluence_threshold_calm: 9   # threshold for calmer instruments
  max_sl_atr_multiplier: 2.5     # SL distance cap
  min_htf_adx: 18                # anti-chop filter
  min_atr_threshold: 0.08        # dead-market guard
# Per-symbol pip size used by the NLM SL buffer (4 pips beyond sweep wick).
# Engine has built-in defaults for XAU/XAG/BTC/EURUSD/GBPUSD/USDJPY;
# add entries here to override or cover other symbols.
pip_sizes:
  XAU/USD: 0.10
  XAG/USD: 0.01
  BTC/USD: 10.0
  EUR/USD: 0.0001
execution:
  slippage_tolerance_percent: 0.1
  max_order_retry: 3
  order_timeout_seconds: 30
  demo_mode:
    simulate_fills: true
    realistic_slippage: true
    latency_ms: 50
  mt5:
    magic_number: 222000
    deviation_points: 10
    fill_policy: FOK
learning:
  # G3 2026-08-30 audit: the grid search tunes CLASSIC-engine parameters
  # (atr_multiplier, rsi_*, confluence_required) which this engine does
  # not read, so it burned CPU for nothing. Note confluence_required:
  # [2, 3] would be dangerous if auto_apply were ever switched on.
  enabled: false
  auto_apply: false
  optimization:
    method: grid_search
    param_ranges:
      atr_multiplier:
      - 1.5
      - 2.0
      - 2.5
      - 3.0
      rsi_oversold:
      - 25
      - 30
      - 35
      rsi_overbought:
      - 65
      - 70
      - 75
      confluence_required:
      - 2
      - 3
    backtest_bars: 1000
    min_trades_required: 500
    optimization_metric: profit_factor
  metrics:
    track:
    - win_rate
    - avg_rr
    - expectancy
    - profit_factor
    - sharpe_ratio
    - max_drawdown
    - avg_trade_duration
    per_symbol: true
    per_timeframe: true
  guardrails:
    min_sample_size: 50
    min_expectancy: 0.5
    max_drawdown_threshold: 20.0
    require_positive_sharpe: true
  versioning:
    enabled: true
    save_rollback: true
    max_versions: 10
backtest:
  lookback_bars: 250
  simulation:
    slippage_percent: 0.05
    commission_percent: 0.1
    latency_bars: 1
  ea_simulation:
    # B1 FIXED 2026-08-30 audit: the live EA takes 5 partials plus a runner
    # close. Every position that reached TP in the Jul 30 - Aug 29 window
    # closed in exactly 6 deals (SMC 4/4, ICT 9/10), never fewer. The
    # backtester was simulating a 3-step ladder against a 5-step live
    # system. This aligns the count; the rest of B1 (one backtester that
    # is EA-faithful end to end) is still open.
    #
    # CONFIRMED against the EA source: PythonFileBridge v2.700 declares
    #   input int    PartialCloseSteps  = 5
    #   input double RunnerPercent      = 10.0
    #   input double TrailATRMultiplier = 2.0
    #   input int    TrailATRPeriod     = 14
    #   input double BreakevenMinRR     = 1.0
    # which is exactly this block. Change them together or the backtester
    # drifts from the live system again.
    partial_close_steps: 5      # Matches EA PartialCloseSteps
    runner_percent: 10.0        # Matches EA RunnerPercent
    breakeven_min_rr: 1.0       # Matches EA BreakevenMinRR
    trail_atr_multiplier: 2.0   # Matches EA TrailATRMultiplier
    trail_atr_period: 14        # Matches EA TrailATRPeriod
  data_source: mt5
  date_range:
    start: 2026-02-08
    end: 2026-02-13
  output:
    save_trades: true
    save_equity_curve: true
    generate_report: true
logging:
  level: DEBUG
  database:
    path: data/trading.db
    backup_enabled: true
    backup_frequency_hours: 24
  log_types:
    analysis: true
    trades: true
