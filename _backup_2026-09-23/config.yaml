general:
  mode: live
  # ADDED 2026-08-30 audit: every Telegram notification is prefixed with
  # this. It used to be a hardcoded launcher component name, so alerts read
  # 'T1'/'T2'/'T3'/'Main' and said nothing about which strategy sent them.
  instance_label: NLM
  # This key is now true rather than decorative: as of the 2026-08-30 audit
  # every clock the Python side reads is UTC. datetime.now() (the host's
  # local clock, 7 hours behind here) was being used for the analysis
  # timestamp in all four engines, and in classic for choosing the session
  # ATR multiplier. Bar-index timestamps from the EA are a separate open
  # question -- see ../verify_server_offset.py.
  timezone: UTC
  log_trades: true
  log_analysis: true
symbols:
