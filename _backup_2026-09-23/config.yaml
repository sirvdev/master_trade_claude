    - trade_entry
    - trade_exit
    - daily_summary
    - drawdown_alert
    - error_critical
    - system_shutdown
  email:
    enabled: false
  dashboard:
    refresh_interval_seconds: 30
dashboard:
  port: 8502
  enable_manual_override: true
  enable_config_edit: true
  enable_learning_trigger: true
  show_charts: true
  chart_bars: 500
smc:
  # Maximum SL distance as a multiple of entry-TF ATR.
  # Prevents structure-based SL from being unrealistically far.
  # Default: 1.5 (was effectively unlimited before this patch).
  max_sl_atr_multiplier: 2.0
 
  # Maximum risk as a multiple of estimated daily range.
  # If the SL distance exceeds this, risk is clamped.
  # Default: 1.5
  max_risk_daily_atr_mult: 2.0
ict:
  # Maximum SL distance as a multiple of entry-TF ATR.
  # ICT's structure SL is already good; this just catches outliers.
  # Default: 2.0 (slightly more generous than SMC because ICT's
  # structure analysis is more precise).
  max_sl_atr_multiplier: 2.0