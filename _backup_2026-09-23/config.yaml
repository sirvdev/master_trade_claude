    # B1 2026-08-30 audit: fixing the symbol matcher means XAU/USDm is now
    # recognised as volatile, which would move its NLM threshold from the calm
    # 9 it has been running on to nlm.confluence_required (12). That is the
    # documented intent, but it is a large tightening on NLM's main symbol, so
    # the live value is pinned here rather than changed as a side effect of a
    # bug fix. DELETE this line to adopt the intended 12.
    nlm_confluence_threshold: 9
    enabled: true
    platform: mt5
    mode: live
