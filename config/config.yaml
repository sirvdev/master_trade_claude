general:
  mode: live
  timezone: UTC
  log_trades: true
  log_analysis: true
symbols:
  XAU/USD:
    enabled: true
    platform: mt5
    mode: live
    timeframes:
    - 1H
    - 15m
    - 5m
    primary_timeframe: 15m
    entry_timeframe: 5m
  XAG/USD:
    enabled: false
    platform: mt5
    mode: live
    timeframes:
    - 4H
    - 15m
    - 1m
    primary_timeframe: 15m
    entry_timeframe: 1m
  BTC/USD:
    enabled: false
    platform: mt5
    mode: live
    timeframes:
    - 1D
    - 4H
    - 15m
    primary_timeframe: 4H
    entry_timeframe: 15m
indicators:
  ema:
    periods:
    - 20
    - 50
    - 200
    apply_to: close
  sma:
    periods:
    - 50
    - 100
    - 200
    apply_to: close
  macd:
    fast_period: 12
    slow_period: 26
    signal_period: 9
  rsi:
    period: 14
    overbought: 70
    oversold: 30
  atr:
    period: 14
    use_for_stops: true
  bollinger_bands:
    period: 20
    std_dev: 2
  supertrend:
    period: 10
    multiplier: 3.0
  parabolic_sar:
    acceleration: 0.02
    maximum: 0.2
  stochastic:
    k_period: 14
    d_period: 3
    smooth_k: 3
    overbought: 80
    oversold: 20
  adx:
    period: 14
    trend_strength_min: 25
  vwap:
    enabled: true
  obv:
    enabled: true
  fibonacci:
    auto_detect_swing: true
    lookback_bars: 50
strategy:
  entry_types:
  - breakout_retest
  - pullback_to_sr
  - momentum_breakout
  confluence_required: 2
  filters:
    respect_higher_tf_bias: true
    allow_override: false
    min_atr_threshold: 0.0005
    max_atr_threshold: 0.05
    news_blackout:
      enabled: false
      windows:
      - start: '13:30'
        end: '14:30'
        days:
        - 1
        - 2
        - 3
        - 4
        - 5
      - start: 07:30
        end: 08:30
        days:
        - 1
        - 2
        - 3
        - 4
        - 5
  candle_patterns:
    enabled: true
    patterns:
    - engulfing
    - pin_bar
    - doji
    - hammer
    - shooting_star
  price_action:
    detect_structure: true
    hhhl_for_uptrend: true
    lhlh_for_downtrend: true
    structure_break_confirmation: true
risk_management:
  max_risk_percent_per_trade: 0.2
  use_dynamic_sizing: true
  stop_loss:
    method: conservative
    atr_multiplier: 1.5
    structure_buffer_pips: 2
  take_profit:
    targets:
    - name: TP1
      rr_ratio: 2
      close_percent: 50
    - name: TP2
      rr_ratio: 3
      close_percent: 30
    - name: TP3
      rr_ratio: 10
      close_percent: 20
    dynamic_extension: true
  trailing_stop:
    enabled: true
    activation_rr: 0.2
    method: atr
    atr_multiplier: 0.3
    percentage: 0.5
    breakeven:
      enabled: true
      trigger_rr: 0.5
      buffer_pips: 1
  long_runner:
    enabled: true
    partial_profit_at_pivots: true
    trail_on_new_highs: true
    max_trail_distance_atr: 3.0
  global_limits:
    daily_max_drawdown_percent: 4.0
    max_concurrent_trades: 10
    max_trades_per_day: 333
    max_risk_per_symbol_percent: 3.0
    cooldown_after_losses:
      enabled: true
      consecutive_losses: 5
      cooldown_seconds: 3600
    emergency_shutdown:
      enabled: true
      trigger_drawdown_percent: 4.7
      close_positions_on_shutdown: false # true = close all positions on any shutdown event, false = only shutdown trading activity, keep existing positions open and reconcile on restart
execution:
  slippage_tolerance_percent: 0.1
  max_order_retry: 3
  order_timeout_seconds: 30
  demo_mode:
    simulate_fills: true
    realistic_slippage: true
    latency_ms: 50
  mt5:
    magic_number: 123456
    deviation_points: 10
    fill_policy: FOK
learning:
  enabled: true
  auto_apply: false
  optimization:
    method: grid_search
    param_ranges:
      atr_multiplier:
      - 1.5
      - 2.0
      - 2.5
      - 3.0
      rsi_oversold:
      - 25
      - 30
      - 35
      rsi_overbought:
      - 65
      - 70
      - 75
      confluence_required:
      - 2
      - 3
    backtest_bars: 1000
    min_trades_required: 500
    optimization_metric: profit_factor
  metrics:
    track:
    - win_rate
    - avg_rr
    - expectancy
    - profit_factor
    - sharpe_ratio
    - max_drawdown
    - avg_trade_duration
    per_symbol: true
    per_timeframe: true
  guardrails:
    min_sample_size: 50
    min_expectancy: 0.5
    max_drawdown_threshold: 20.0
    require_positive_sharpe: true
  versioning:
    enabled: true
    save_rollback: true
    max_versions: 10
backtest:
  data_source: mt5
  date_range:
    start: 2026-02-08
    end: 2026-02-13
  lookback_bars: 500
  timeframes:
    entry_timeframe: 15m
    minimum_timeframe: 1m
  simulation:
    realistic_slippage: true
    slippage_percent: 0.05
    commission_percent: 0.1
    latency_bars: 1
  output:
    save_trades: true
    save_equity_curve: true
    generate_report: true
logging:
  level: DEBUG
  database:
    path: data/trading.db
    backup_enabled: true
    backup_frequency_hours: 24
  log_types:
    analysis: true
    trades: true
    orders: true
    errors: true
    api_calls: false
  export:
    auto_export_csv: false
    export_frequency_hours: 168
notifications:
  telegram:
    enabled: false
    events:
    - trade_entry
    - trade_exit
    - daily_summary
    - drawdown_alert
    - error_critical
    - system_shutdown
  email:
    enabled: false
  dashboard:
    refresh_interval_seconds: 5
dashboard:
  port: 8501
  enable_manual_override: true
  enable_config_edit: true
  enable_learning_trigger: true
  show_charts: true
  chart_bars: 500
